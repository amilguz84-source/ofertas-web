name: Actualizar ofertas

on:
  schedule:
    - cron: "*/20 * * * *"   # cada 20 minutos
  workflow_dispatch:          # también permite lanzarlo manualmente desde GitHub
    inputs:
      force:
        description: "Reprocesar TODAS las ofertas desde cero (marca esto tras corregir el scraper)"
        type: boolean
        default: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python scraper.py --channel ofertasychollosesp --out ofertas.json ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Publicar cambios si hay ofertas nuevas
        run: |
          git config user.name "ofertas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ofertas.json
          git diff --quiet --cached || git commit -m "Actualizar ofertas $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
